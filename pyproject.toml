[project]
name = "simple-chebyshev-polynomial"
version = "0.1.1"
description = "Evaluates Chebyshev polynomials of the first and second kind, Tn(x) and Un(x), for any non-negative integer n and any real x."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
